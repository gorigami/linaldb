[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linaldb-server"
version = "0.1.2"
description = "Python client for LINALDB, a SQL-inspired analytical engine for vectors, matrices, and tensors"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "gorigami", email = "develop@gorigami.xyz" },
    { name = "Nicolás Balaguera" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.28",
    "pyarrow>=14.0",
]

[project.urls]
Homepage = "https://github.com/gorigami/linaldb"
Repository = "https://github.com/gorigami/linaldb"
Issues = "https://github.com/gorigami/linaldb/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7.0", "pandas>=1.5", "numpy>=1.20"]

[tool.hatch.build.targets.wheel]
packages = ["linaldb_server"]
