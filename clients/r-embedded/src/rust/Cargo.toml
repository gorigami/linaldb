[package]
name = 'linalr'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'linaldb_embedded'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '*'
linal = { path = "../../../.." }

[profile.release]
lto = true
codegen-units = 1
