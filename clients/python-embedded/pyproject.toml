[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "linaldb"
version = "0.1.0"
description = "Embedded native Python bindings for LINALDB — in-process TensorDb via PyO3, no server required"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LinalDB Community License v1.0" }
authors = [{ name = "gorigami" }]
dependencies = [
    "pyarrow>=14.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7.0", "pandas>=1.5"]

[tool.maturin]
module-name = "linaldb._native"
python-source = "python"
manifest-path = "Cargo.toml"
