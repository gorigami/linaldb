[package]
name = "linal-python"
version = "0.1.16"
edition = "2021"
description = "PyO3 native bindings for LINALDB — embeds the same synchronous TensorDb/execute_line the CLI/REPL uses directly in a Python process, no server required."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
linal = { path = "../.." }
# Same version as the root crate, so `RecordBatch` is the type `TensorDb::load_record_batch` takes.
arrow = { version = "53.3.0", default-features = false, features = ["ipc"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
