[package]
name = "linal"
version = "0.1.89"
edition = "2021"
description = "In-memory linear algebra engine for vectors, matrices and tensors"

[[bin]]
name = "linal"
path = "src/main.rs"

[dependencies]
arrow = "53.3.0"
arrow-csv = "53.3.0"
axum = "0.7.9"
clap = { version = "4.5.53", features = ["derive"] }
parquet = { version = "53.3.0", features = ["arrow"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8.19"
rustyline = { version = "14.0.0", features = ["derive"] }
colored = "2.1.0"
utoipa = { version = "4.2.3" }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"] }
toon-format = "0.4.0"
chrono = { version = "0.4.39", features = ["serde"] }
bumpalo = "3.14"  # Arena allocator for ExecutionContext
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
rayon = "1.11.0"
logos = "0.14"
smallvec = "1.13"
hdf5 = { package = "hdf5-metno", version = "0.14.1", features = ["static", "zlib"] }
ndarray = "0.17"
ndarray-npy = { version = "0.10.0", features = ["npz"] }
zarrs = { version = "0.19.0", features = ["ndarray", "filesystem"] }
realfft = "3.5.0"
nalgebra = "0.33"
# Already resolved transitively (nalgebra pulls it in for Schur/eigendecomposition), promoted
# to a direct dependency for Value::Complex (core/value.rs) -- see
# SCIENTIFIC_ENGINE_EXPANSION_PLAN.md Phase 3.
num-complex = { version = "0.4", features = ["serde"] }
comfy-table = "7.2.2"
indicatif = "0.17"
# HNSW vector index (src/core/index/hnsw.rs) -- see PERFORMANCE_OPTIMIZATION_PLAN.md
# Phase 1. Pure Rust, no C/system dependency, consistent with this repo's existing
# build philosophy (vendored HDF5, rustls-tls). `with-serde` needed for
# CREATE VECTOR INDEX ... USING HNSW's SAVE/LOAD DATASET persistence.
instant-distance = { version = "0.6.1", default-features = false, features = ["with-serde"] }
# Dense-matmul backend (src/engine/kernels.rs, reached from
# CpuBackend::matmul) -- see PERFORMANCE_OPTIMIZATION_PLAN.md Phase 4 and
# docs/SCALING_AND_GPU_ROADMAP.md. Linked in through the `faer-matmul`
# feature, on by default since the DSL's MATMUL was routed through it
# (~34x at 1024^2); `--no-default-features` drops it. Pure Rust, no C/Fortran BLAS toolchain,
# chosen specifically to preserve this repo's existing "no system library
# dependency" build property (vendored HDF5, rustls-tls) -- an OpenBLAS-style
# backend would have reintroduced exactly that. A real benchmark
# (benches/matmul_backend.rs) measured it ~8-22x faster than the existing
# hand-rolled/Rayon kernel across 50..1000-square matrices, growing with N.
faer = { version = "0.24.4", optional = true }
# Optional GPU compute backend (src/core/backend/gpu/) -- see
# docs/SCALING_AND_GPU_ROADMAP.md Track C. Only linked in when the `gpu-wgpu`
# feature is enabled. wgpu is pure Rust over the OS's own graphics API
# (Metal on macOS, Vulkan/DX12 elsewhere), so like faer it keeps the "no
# system library dependency" build property; CUDA would not.
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[features]
default = ["faer-matmul"]
zero-copy = []  # Enable Arc-based tensor storage
experimental = ["zero-copy"]  # Bundle experimental features
faer-matmul = ["dep:faer"]  # faer-backed dense matmul kernel (on by default; `--no-default-features` for the hand-rolled SIMD kernel)
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]  # Opt-in wgpu compute backend (spike)

[[example]]
name = "gen_test_data"
path = "tools/fixtures/gen_test_data.rs"

[[example]]
name = "gen_zarr_data"
path = "tools/fixtures/gen_zarr_data.rs"

[[example]]
name = "gen_digits_data"
path = "tools/fixtures/gen_digits_data.rs"

[[example]]
name = "gen_gw_data"
path = "tools/fixtures/gen_gw_data.rs"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
faer = "0.24.4"

[[bench]]
name = "tensor_ops"
harness = false

[[bench]]
name = "queries"
harness = false

[[bench]]
name = "phase1_benchmarks"
harness = false

[[bench]]
name = "dataset_ops"
harness = false

[[bench]]
name = "server_transport"
harness = false

[[bench]]
name = "matmul_backend"
harness = false

[[bench]]
name = "gpu_backend"
harness = false
required-features = ["gpu-wgpu"]
