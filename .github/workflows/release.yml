name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate test data
        run: |
          cargo run --example gen_test_data --release --target ${{ matrix.target }}
          cargo run --example gen_zarr_data --release --target ${{ matrix.target }}

      - name: Run smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/linal run examples/smoke_test.lnl

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\target\${{ matrix.target }}\release\linal.exe run examples/smoke_test.lnl

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="linal-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          strip "target/${{ matrix.target }}/release/linal"
          cp "target/${{ matrix.target }}/release/linal" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $staging = "linal-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\linal.exe" "$staging\"
          Copy-Item "README.md","LICENSE" "$staging\"
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
